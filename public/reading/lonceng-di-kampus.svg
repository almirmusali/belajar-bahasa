<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Обложка книги «Lonceng di Kampus»">
  <title>LONCENG DI KAMPUS</title>
  <defs>
    <linearGradient id="dusk6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1c10"/>
      <stop offset="45%" stop-color="#5c3a1c"/>
      <stop offset="78%" stop-color="#b5732f"/>
      <stop offset="100%" stop-color="#e8a94f"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d59a"/>
      <stop offset="60%" stop-color="#c39a4e"/>
      <stop offset="100%" stop-color="#7d5c26"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#dusk6)"/>

  <!-- Шесть вечера: колокол бьёт в тот момент, когда декан выходит. -->
  <circle cx="300" cy="470" r="210" fill="#ffd48a" opacity=".13"/>
  <circle cx="300" cy="470" r="150" fill="#ffd48a" opacity=".12"/>

  <!-- Колокольня силуэтом. -->
  <g fill="#1d1208">
    <path d="M188 900 L188 372 L300 288 L412 372 L412 900 Z"/>
  </g>
  <rect x="212" y="392" width="176" height="196" fill="#3a2411"/>

  <!-- Сам колокол. -->
  <g transform="translate(300 470)">
    <rect x="-4" y="-88" width="8" height="20" fill="#6b4d1f"/>
    <path d="M-58 46 Q-58 -46 0 -66 Q58 -46 58 46 Z" fill="url(#bell)"/>
    <ellipse cx="0" cy="48" rx="66" ry="12" fill="#e2c283"/>
    <circle cx="0" cy="62" r="10" fill="#4c3616"/>
  </g>

  <!-- Полки библиотеки внизу: место, где всё случилось. -->
  <g fill="#180f07" opacity=".95">
    <rect y="742" width="600" height="158"/>
  </g>
  <g fill="#4a2f14">
    <rect x="40" y="768" width="14" height="72"/><rect x="60" y="776" width="11" height="64"/>
    <rect x="77" y="762" width="16" height="78"/><rect x="99" y="780" width="10" height="60"/>
    <rect x="115" y="770" width="13" height="70"/>
    <rect x="466" y="772" width="13" height="68"/><rect x="485" y="762" width="16" height="78"/>
    <rect x="507" y="780" width="10" height="60"/><rect x="523" y="768" width="14" height="72"/>
    <rect x="543" y="776" width="11" height="64"/>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="300" y="132" font-size="25" letter-spacing="15" fill="#ffe4b6" opacity=".62">LONCENG DI</text>
    <text x="300" y="206" font-size="60" letter-spacing="5" fill="#fff3de" font-weight="bold">KAMPUS</text>
    <line x1="208" y1="242" x2="392" y2="242" stroke="#fff3de" stroke-width="1" opacity=".45"/>
    <text x="300" y="276" font-size="18" letter-spacing="2" fill="#ffe9c9" opacity=".8" font-style="italic">Cerita detektif</text>
    <text x="300" y="876" font-size="13" letter-spacing="6" fill="#e7b878" opacity=".5">BAHASA INDONESIA MUDAH</text>
  </g>
</svg>
