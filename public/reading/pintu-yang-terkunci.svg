<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Обложка книги «Pintu yang Terkunci»">
  <title>PINTU YANG TERKUNCI</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191218"/>
      <stop offset="100%" stop-color="#2c1f24"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a2f22"/>
      <stop offset="45%" stop-color="#6b452f"/>
      <stop offset="100%" stop-color="#3d2619"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffce7a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffce7a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#wall)"/>

  <!-- Дверь во всю обложку: из-под неё виден свет, но войти нельзя. -->
  <rect x="150" y="300" width="300" height="560" rx="4" fill="url(#door)"/>
  <rect x="170" y="330" width="120" height="200" rx="3" fill="#2f1d13" opacity=".55"/>
  <rect x="310" y="330" width="120" height="200" rx="3" fill="#2f1d13" opacity=".55"/>
  <rect x="170" y="560" width="120" height="230" rx="3" fill="#2f1d13" opacity=".55"/>
  <rect x="310" y="560" width="120" height="230" rx="3" fill="#2f1d13" opacity=".55"/>

  <!-- Полоска тёплого света на полу. -->
  <rect x="150" y="856" width="300" height="44" fill="#1a1116"/>
  <rect x="150" y="838" width="300" height="22" fill="url(#glow)" transform="scale(1 -1) translate(0 -1698)"/>
  <rect x="150" y="852" width="300" height="6" fill="#ffd58c" opacity=".8"/>

  <!-- Ручка и замочная скважина: ключ остался внутри. -->
  <circle cx="405" cy="586" r="12" fill="#d8b268"/>
  <rect x="386" y="612" width="38" height="52" rx="6" fill="#c9a35c"/>
  <circle cx="405" cy="630" r="7" fill="#20140d"/>
  <path d="M401 634 L409 634 L407 652 L403 652 Z" fill="#20140d"/>

  <!-- Ключ, торчащий изнутри: его видно только в щель. -->
  <g transform="translate(405 630)" opacity=".9">
    <rect x="-2" y="6" width="4" height="40" fill="#e6c583"/>
    <rect x="-2" y="40" width="12" height="4" fill="#e6c583"/>
    <rect x="-2" y="30" width="9" height="4" fill="#e6c583"/>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="300" y="130" font-size="25" letter-spacing="14" fill="#e8cfae" opacity=".6">PINTU YANG</text>
    <text x="300" y="204" font-size="56" letter-spacing="5" fill="#fbeedd" font-weight="bold">TERKUNCI</text>
    <line x1="204" y1="240" x2="396" y2="240" stroke="#fbeedd" stroke-width="1" opacity=".45"/>
    <text x="300" y="274" font-size="18" letter-spacing="2" fill="#f0dcc4" opacity=".8" font-style="italic">Cerita detektif</text>
  </g>
  <text x="300" y="892" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="6" fill="#c8a274" opacity=".45">BAHASA INDONESIA MUDAH</text>
</svg>
