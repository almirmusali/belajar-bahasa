<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Обложка книги «The Greater Good»">
  <title>THE GREATER GOOD</title>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="42%" stop-color="#1a1430"/>
      <stop offset="75%" stop-color="#33244a"/>
      <stop offset="100%" stop-color="#5c3a52"/>
    </linearGradient>
    <radialGradient id="goldglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d98a" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#e8bd63" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#e8bd63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e3a8"/>
      <stop offset="100%" stop-color="#c99a45"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0916"/>
      <stop offset="100%" stop-color="#070510"/>
    </linearGradient>
    <radialGradient id="window" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98c" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity=".85"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#dusk)"/>

  <!-- Звёзды -->
  <g fill="#efe9ff">
    <circle cx="58" cy="92" r="1.5" opacity=".75"/><circle cx="140" cy="176" r="1.1" opacity=".55"/>
    <circle cx="86" cy="312" r="1.3" opacity=".6"/><circle cx="204" cy="108" r="1" opacity=".5"/>
    <circle cx="268" cy="66" r="1.4" opacity=".7"/><circle cx="352" cy="140" r="1" opacity=".5"/>
    <circle cx="532" cy="88" r="1.5" opacity=".75"/><circle cx="486" cy="198" r="1.1" opacity=".55"/>
    <circle cx="560" cy="300" r="1.2" opacity=".55"/><circle cx="428" cy="58" r="1.1" opacity=".55"/>
    <circle cx="40" cy="452" r="1.1" opacity=".45"/><circle cx="572" cy="430" r="1" opacity=".45"/>
    <circle cx="120" cy="410" r="1" opacity=".4"/><circle cx="470" cy="352" r="1.1" opacity=".5"/>
    <circle cx="320" cy="200" r="1" opacity=".45"/><circle cx="230" cy="270" r="1" opacity=".4"/>
  </g>

  <!-- Сияние за знаком -->
  <circle cx="300" cy="400" r="230" fill="url(#goldglow)"/>

  <!-- Знак Даров Смерти -->
  <g stroke="url(#goldline)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".55" filter="url(#soft2)" stroke-width="13">
      <path d="M300 240 L436 500 L164 500 Z"/>
      <circle cx="300" cy="413" r="86"/>
      <line x1="300" y1="240" x2="300" y2="500"/>
    </g>
    <g stroke-width="7">
      <path d="M300 240 L436 500 L164 500 Z"/>
      <circle cx="300" cy="413" r="86"/>
      <line x1="300" y1="240" x2="300" y2="500"/>
    </g>
  </g>

  <!-- Трещина в круге камня -->
  <path d="M300 340 l-10 24 14 20 -10 22 8 16" stroke="#0a0812" stroke-width="5" fill="none" opacity=".85"/>

  <!-- Холмы и деревня -->
  <path d="M0 720 Q120 668 240 700 T600 690 V900 H0 Z" fill="url(#hills)"/>
  <!-- Дома Годриковой Впадины: два дома через улицу -->
  <g fill="#05040c">
    <path d="M96 760 h96 v-70 l-48 -34 -48 34 Z"/>
    <path d="M408 764 h100 v-74 l-50 -36 -50 36 Z"/>
    <rect x="250" y="716" width="34" height="46" />
    <path d="M250 716 l17 -14 17 14 Z"/>
    <rect x="318" y="722" width="28" height="40"/>
    <path d="M318 722 l14 -11 14 11 Z"/>
    <rect x="30" y="726" width="40" height="36"/>
    <rect x="540" y="730" width="36" height="32"/>
  </g>
  <!-- Церковный шпиль -->
  <path d="M560 762 v-90 l10 -26 10 26 v90 Z" fill="#05040c"/>

  <!-- Два освещённых окна друг напротив друга -->
  <g filter="url(#soft2)">
    <rect x="132" y="706" width="18" height="24" rx="2" fill="url(#window)"/>
    <rect x="446" y="708" width="18" height="24" rx="2" fill="url(#window)"/>
  </g>
  <circle cx="141" cy="718" r="26" fill="url(#goldglow)" opacity=".9"/>
  <circle cx="455" cy="720" r="26" fill="url(#goldglow)" opacity=".9"/>

  <!-- Заголовок -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="300" y="120" fill="#f3e6c2" font-size="30" letter-spacing="14" opacity=".85">THE</text>
    <text x="300" y="176" fill="url(#goldline)" font-size="58" font-weight="bold" letter-spacing="6">GREATER GOOD</text>
    <text x="300" y="820" fill="#e8ddc8" font-size="22" font-style="italic" opacity=".9">The confession of Albus Dumbledore</text>
    <text x="300" y="862" fill="#bfae90" font-size="17" letter-spacing="3" opacity=".8">INTERMEDIATE ENGLISH · B1–B2</text>
  </g>
</svg>
