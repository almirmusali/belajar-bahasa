<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Обложка книги «Hujan di Stasiun Tugu»">
  <title>HUJAN DI STASIUN TUGU</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="60%" stop-color="#16233c"/>
      <stop offset="100%" stop-color="#243554"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="60%" stop-color="#ffc35e" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffc35e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#night)"/>

  <!-- Навес перрона. -->
  <path d="M0 372 L600 340 L600 396 L0 428 Z" fill="#0d1524"/>
  <g fill="#0d1524">
    <rect x="96" y="396" width="12" height="300"/>
    <rect x="300" y="380" width="12" height="300"/>
    <rect x="492" y="364" width="12" height="300"/>
  </g>

  <!-- Один горящий фонарь; второй, у которого лежал Баю, погас. -->
  <circle cx="306" cy="430" r="120" fill="url(#lamp)"/>
  <circle cx="306" cy="430" r="13" fill="#ffe6ae"/>
  <circle cx="498" cy="414" r="13" fill="#1b2740"/>

  <!-- Перрон и рельсы, уходящие в темноту. -->
  <rect y="690" width="600" height="210" fill="#101a2c"/>
  <g stroke="#2f4262" stroke-width="4">
    <line x1="0" y1="742" x2="600" y2="742"/>
    <line x1="0" y1="772" x2="600" y2="772"/>
  </g>
  <g fill="#1b2740">
    <rect x="30" y="736" width="18" height="44"/><rect x="150" y="736" width="18" height="44"/>
    <rect x="270" y="736" width="18" height="44"/><rect x="390" y="736" width="18" height="44"/>
    <rect x="510" y="736" width="18" height="44"/>
  </g>

  <!-- Термос: он в этой книге и улика, и часы. -->
  <g transform="translate(306 612)">
    <rect x="-22" y="-70" width="44" height="76" rx="7" fill="#a8332e"/>
    <rect x="-18" y="-84" width="36" height="18" rx="5" fill="#7d2622"/>
    <rect x="-22" y="-34" width="44" height="8" fill="#8a2a26"/>
    <ellipse cx="0" cy="14" rx="30" ry="7" fill="#0a1120" opacity=".6"/>
  </g>

  <!-- Косой дождь поверх всего. -->
  <g stroke="#9fc0e8" stroke-width="1.3" opacity=".3">
    <line x1="60" y1="60" x2="30" y2="200"/><line x1="170" y1="20" x2="140" y2="164"/>
    <line x1="286" y1="80" x2="256" y2="220"/><line x1="400" y1="30" x2="370" y2="170"/>
    <line x1="520" y1="90" x2="490" y2="230"/><line x1="90" y1="520" x2="60" y2="660"/>
    <line x1="240" y1="560" x2="210" y2="700"/><line x1="420" y1="530" x2="390" y2="668"/>
    <line x1="560" y1="580" x2="530" y2="716"/>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="300" y="140" font-size="24" letter-spacing="13" fill="#cfe0f5" opacity=".6">HUJAN DI</text>
    <text x="300" y="206" font-size="46" letter-spacing="4" fill="#f2f7ff" font-weight="bold">STASIUN TUGU</text>
    <line x1="196" y1="242" x2="404" y2="242" stroke="#f2f7ff" stroke-width="1" opacity=".45"/>
    <text x="300" y="276" font-size="18" letter-spacing="2" fill="#dceaf9" opacity=".8" font-style="italic">Cerita detektif</text>
    <text x="300" y="852" font-size="14" letter-spacing="6" fill="#a9c3e2" opacity=".5">BAHASA INDONESIA MUDAH</text>
  </g>
</svg>
